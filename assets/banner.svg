      <stop offset="0" stop-color="#16070b"/>
      <stop offset="0.55" stop-color="#3a0b17"/>
      <stop offset="1" stop-color="#7d0f23"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
